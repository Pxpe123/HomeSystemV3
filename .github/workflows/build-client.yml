
name: Build Qt App

on:
  push:
    paths:
      - "Packages/display-client/**"
      - ".github/workflows/build-qt.yml"
  pull_request:
    paths:
      - "Packages/display-client/**"
      - ".github/workflows/build-qt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022

    defaults:
      run:
        working-directory: Packages/display-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine
          cache: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
        continue-on-error: true

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/windows-x64
          Get-ChildItem build -Recurse -File |
            Where-Object { $_.Extension -eq ".exe" } |
            Copy-Item -Destination release/windows-x64 -Force

          if (-not (Get-ChildItem release/windows-x64 -Filter "*.exe")) {
            throw "No executable found. Check your CMake output path."
          }

          windeployqt --release --dir release/windows-x64 `
            (Get-ChildItem release/windows-x64 -Filter "*.exe" |
              Select-Object -First 1).FullName

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: display-client-windows-x64
          path: Packages/display-client/release/windows-x64/
          if-no-files-found: error
          retention-days: 30

  build-rpi:
    name: Raspberry Pi ARM64
    # Register a Raspberry Pi runner in GitHub repository Settings.
    runs-on: [self-hosted, Linux, ARM64]

    defaults:
      run:
        working-directory: Packages/display-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build tools
        run: |
          cmake --version
          c++ --version
          pkg-config --modversion Qt6Core

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
        continue-on-error: true

      - name: Package Raspberry Pi build
        run: |
          mkdir -p release/rpi-arm64
          find build -type f -executable \
            ! -name '*.sh' \
            -exec cp {} release/rpi-arm64/ \;

          test -n "$(find release/rpi-arm64 -type f -print -quit)" \
            || { echo "No executable found"; exit 1; }

          tar -czf release/display-client-rpi-arm64.tar.gz \
            -C release/rpi-arm64 .

      - name: Upload Raspberry Pi build
        uses: actions/upload-artifact@v4
        with:
          name: display-client-rpi-arm64
          path: Packages/display-client/release/display-client-rpi-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
