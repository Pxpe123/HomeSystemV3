name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: WebUI and .NET checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.identity.outputs.HOMESYSTEM_BUILD_VERSION }}
      build-id: ${{ steps.identity.outputs.HOMESYSTEM_BUILD_ID }}
      commit: ${{ steps.identity.outputs.HOMESYSTEM_BUILD_COMMIT }}
      built-at: ${{ steps.identity.outputs.HOMESYSTEM_BUILD_TIME_UTC }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: apps/control-server/global.json
      - run: node scripts/check-layout.mjs
      - name: Stamp one identity for every build artifact
        id: identity
        run: node apps/web-ui/scripts/build-info.mjs
      - run: python3 -m unittest discover -s scripts/deployment -p 'test_*.py' -v
      - run: npm ci --prefix apps/web-ui
      - run: npm run verify --prefix apps/web-ui
      - name: Restore locked .NET dependencies
        working-directory: apps/control-server
        run: dotnet restore HomeSystem.sln --configfile NuGet.Config --locked-mode
      - name: Publish ControlServer and Windows agent
        run: |
          dotnet publish apps/control-server/CentralServer.csproj -c Release --no-restore -p:UseAppHost=false -o Deployments/control-server
          dotnet publish apps/desktop-agent/PcAgent.csproj -c Release --no-restore -p:UseAppHost=false -o Deployments/desktop-agent
      - name: Account persistence and token lifecycle tests
        working-directory: apps/control-server
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet run --project tests/AccountTests.csproj -c Release --no-restore
          node tests/verify-accounts.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-builds
          path: Deployments/
          if-no-files-found: error
          retention-days: 7

  display-clients:
    name: Qt ${{ matrix.platform }} client
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            target: desktop
            arch: win64_msvc2022_64
            modules: qtwebengine qtwebchannel qtpositioning qtserialport qtwebsockets
          - platform: android
            target: android
            arch: android_arm64_v8a
            modules: qtwebview
    env:
      HOMESYSTEM_BUILD_VERSION: ${{ needs.checks.outputs.version }}
      HOMESYSTEM_BUILD_ID: ${{ needs.checks.outputs.build-id }}
      HOMESYSTEM_BUILD_COMMIT: ${{ needs.checks.outputs.commit }}
      HOMESYSTEM_BUILD_TIME_UTC: ${{ needs.checks.outputs.built-at }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Locate Windows native build tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual C++ x64 tools are missing' }
          $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
          $ninja = Join-Path $installation 'Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe'
          if (-not (Test-Path -LiteralPath $vcvars) -or -not (Test-Path -LiteralPath $ninja)) {
            throw 'Required MSVC or Ninja tool was not found'
          }
          "HOMESYSTEM_VCVARS=$vcvars" >> $env:GITHUB_ENV
          "HOMESYSTEM_NINJA=$ninja" >> $env:GITHUB_ENV
      - name: Set up Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and NDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      - name: Install Qt 6.10.1 and matching host tools
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.10.1"
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          modules: ${{ matrix.modules }}
          cache: true
          cache-key-prefix: homesystem-qt-${{ matrix.platform }}
      - name: Package native client and build manifest
        shell: pwsh
        env:
          CLIENT_PLATFORM: ${{ matrix.platform }}
        run: |
          $env:HOMESYSTEM_QT_PREFIX = $env:QT_ROOT_DIR
          $env:HOMESYSTEM_QT_ANDROID = $env:QT_ROOT_DIR
          node scripts/build-ci-display.mjs $env:CLIENT_PLATFORM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installable client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: display-client-${{ matrix.platform }}
          path: Deployments/display-client/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  containers:
    name: ARM64 ${{ matrix.app }} image
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [control-server, web-ui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build native Raspberry Pi image
        env:
          APP: ${{ matrix.app }}
          HOMESYSTEM_BUILD_VERSION: ${{ needs.checks.outputs.version }}
          HOMESYSTEM_BUILD_ID: ${{ needs.checks.outputs.build-id }}
          HOMESYSTEM_BUILD_COMMIT: ${{ needs.checks.outputs.commit }}
          HOMESYSTEM_BUILD_TIME_UTC: ${{ needs.checks.outputs.built-at }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${APP}:${GITHUB_SHA}"
          docker build --build-arg HOMESYSTEM_BUILD_VERSION --build-arg HOMESYSTEM_BUILD_ID \
            --build-arg HOMESYSTEM_BUILD_COMMIT --build-arg HOMESYSTEM_BUILD_TIME_UTC \
            --label "org.opencontainers.image.version=${HOMESYSTEM_BUILD_VERSION}" \
            --label "org.opencontainers.image.created=${HOMESYSTEM_BUILD_TIME_UTC}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" "apps/$APP"
      - name: Publish only trusted main builds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ matrix.app }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}/${APP}:${GITHUB_SHA}"
      - name: Registry logout
        if: always()
        run: docker logout ghcr.io
