name: homesystem-v3

services:
  homesystem-server:
    image: ${CONTROL_SERVER_IMAGE:?Set the tested ControlServer image}
    env_file: /opt/stacks/homesystem-v3/.server.env
    environment:
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    ports:
      - 8080:8080
    volumes:
      - homesystem-data:/var/lib/homesystem
    restart: unless-stopped
    networks:
      - homesystem
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8080/api/health || exit 1
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  homesystem-ui:
    image: ${WEB_UI_IMAGE:?Set the tested WebUI image}
    ports:
      - 8088:80
    restart: unless-stopped
    networks:
      - homesystem
    depends_on:
      homesystem-server:
        condition: service_healthy

networks:
  homesystem:
    name: homesystem

volumes:
  homesystem-data:
    name: homesystem-data